name: Release

# Triggered by a `release/*` tag push (e.g. `git tag release/0.8.1 && git push --tags`).
# Can also be run manually via Actions → "Run workflow" to test the pipeline
# without creating a tag — the release-publish job is skipped in that case.

on:
  push:
    tags: ['release/*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.8.1). Defaults to the newest release/* tag (release.sh if none).'
        required: false
      upload_to_app_store:
        description: 'Upload the Mac App Store build to App Store Connect (otherwise build + validate only).'
        type: boolean
        default: false

permissions:
  contents: write

# Xcode 26.x installed on the macos-26 runner image; bump when the image's
# list (actions/runner-images, macos-26 README) drops it.
env:
  XCODE_VERSION: "26.6"

jobs:
  # ── Resolve the release version once ─────────────────────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      build_number: ${{ steps.ver.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/release/* ]]; then
            V="${GITHUB_REF_NAME#release/}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          else
            LATEST="$(git tag -l 'release/*' --sort=-v:refname | head -1)"
            if [[ -n "$LATEST" ]]; then
              V="${LATEST#release/}"
            else
              V="$(grep '^VERSION=' DiskFree/release.sh | head -1 | sed 's/VERSION="\(.*\)"/\1/')"
            fi
          fi
          echo "version=$V"          >> "$GITHUB_OUTPUT"
          echo "tag=release/$V"    >> "$GITHUB_OUTPUT"
          # Unique per re-run: CFBundleVersion must not repeat in App Store Connect.
          echo "build_number=${{ github.run_number }}.${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  # ── Unit tests (never the UI tests) ──────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Run unit tests
        run: |
          cd DiskFree && xcodebuild test \
            -project DiskFree.xcodeproj -scheme DiskFree \
            -destination 'platform=macOS' \
            -skip-testing:DiskFreeUITests \
            CODE_SIGNING_ALLOWED=NO

  # ── Build, sign, notarize, and package DiskFree ───────────────────────────────
  build:
    name: Build macOS App
    runs-on: macos-26
    needs: [version, test]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - uses: actions/cache@v4
        with:
          path: DiskFree/DerivedData
          key: xcode-${{ hashFiles('DiskFree/DiskFree.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: xcode-

      # Import Developer ID Application + Installer certs into a throwaway
      # keychain. Skips gracefully (has_cert=false) if the secret is absent.
      - name: Import Developer ID certificate
        id: cert
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$P12_B64" ]]; then
            echo "APPLE_CERTIFICATE_P12_BASE64 not set — skipping signing"
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain"
          P12="$RUNNER_TEMP/certs.p12"
          echo "$P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"
          TEAM="${{ secrets.APPLE_TEAM_ID }}"
          APP_N=$(security find-identity -v "$KC" | grep -c "Developer ID Application:.*${TEAM}" || true)
          PKG_N=$(security find-identity -v "$KC" | grep -c "Developer ID Installer:.*${TEAM}"  || true)
          if [[ "$APP_N" -lt 1 || "$PKG_N" -lt 1 ]]; then
            echo "::error::Missing Developer ID identities for team ${TEAM}." \
                 "Found Application=${APP_N}, Installer=${PKG_N} (need 1 of each)."
            exit 1
          fi
          rm -f "$P12"
          # Extract the signing identity from the keychain so callers don't
          # need a separate APPLE_SIGN_IDENTITY secret.
          APP_IDENTITY=$(security find-identity -v "$KC" \
            | grep "Developer ID Application:.*${TEAM}" \
            | head -1 \
            | sed 's/.*"\(.*\)"/\1/')
          echo "has_cert=true"             >> "$GITHUB_OUTPUT"
          echo "sign_identity=$APP_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Stage App Store Connect API key
        if: steps.cert.outputs.has_cert == 'true'
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Build, sign, notarize, and package
        env:
          VERSION:             ${{ needs.version.outputs.version }}
          BUILD_NUMBER:        ${{ needs.version.outputs.build_number }}
          SIGN_IDENTITY:       ${{ steps.cert.outputs.sign_identity }}
          APPLE_TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH:  ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          HAS_CERT:            ${{ steps.cert.outputs.has_cert }}
        run: |
          SIGN_ARGS=()
          if [[ "$HAS_CERT" == "true" && -n "$SIGN_IDENTITY" ]]; then
            SIGN_ARGS+=(--sign "$SIGN_IDENTITY" --notarize)
          fi
          cd DiskFree && ./release.sh \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --out "../dist" \
            "${SIGN_ARGS[@]}"

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -rf "$RUNNER_TEMP/private_keys"

      - uses: actions/upload-artifact@v4
        with:
          name: disk-free-macos
          path: dist/*.pkg
          if-no-files-found: error

  # ── Build, sign and upload the Mac App Store package ─────────────────────────
  # No-op (exit 0) until the MAS_* secrets exist, except a manual run that asked
# for an upload, which fails.
  app-store:
    name: Mac App Store
    runs-on: macos-26
    needs: [version, test]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Import Mac App Store certificates and profile
        id: mas
        env:
          P12_B64: ${{ secrets.MAS_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          UPLOAD_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store }}
        run: |
          if [[ -z "$P12_B64" ]]; then
            if [[ "$UPLOAD_REQUESTED" == "true" ]]; then
              echo "::error::upload_to_app_store was ticked but MAS_CERTIFICATE_P12_BASE64 is not set. Add the MAS_* secrets (MAS_CERTIFICATE_P12_BASE64, MAS_CERTIFICATE_PASSWORD, MAS_PROVISIONING_PROFILE_BASE64)."
              exit 1
            fi
            echo "::notice::MAS_CERTIFICATE_P12_BASE64 not set — skipping Mac App Store build"
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$PROFILE_B64" ]]; then
            echo "::error::MAS_PROVISIONING_PROFILE_BASE64 not set"
            exit 1
          fi
          KC="$RUNNER_TEMP/mas.keychain"
          P12="$RUNNER_TEMP/mas-certs.p12"
          echo "$P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          security find-identity -v "$KC"
          # The installer identity is not a codesigning identity, so list all.
          APP_N=$(security find-identity -v "$KC" | grep -c "Apple Distribution:.*${TEAM}" || true)
          PKG_N=$(security find-certificate -a -c "Installer" "$KC" | grep -cE '"(3rd Party Mac Developer Installer|Mac Installer Distribution):.*'"${TEAM}" || true)
          if [[ "$APP_N" -lt 1 || "$PKG_N" -lt 1 ]]; then
            echo "::error::Missing Mac App Store identities for team ${TEAM}." \
                 "Found Apple Distribution=${APP_N}, Installer=${PKG_N} (need 1 of each)."
            exit 1
          fi
          if security find-certificate -a -c "Mac Installer Distribution" "$KC" >/dev/null 2>&1; then
            echo "installer=Mac Installer Distribution" >> "$GITHUB_OUTPUT"
          else
            echo "installer=3rd Party Mac Developer Installer" >> "$GITHUB_OUTPUT"
          fi

          PROFILE="$RUNNER_TEMP/mas.provisionprofile"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE"
          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)
          PDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PDIR"
          mv "$PROFILE" "$PDIR/$UUID.provisionprofile"
          echo "has_cert=true" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$UUID" >> "$GITHUB_OUTPUT"

      - name: Stage App Store Connect API key
        if: steps.mas.outputs.has_cert == 'true'
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Build, sign and upload Mac App Store package
        id: upload
        if: steps.mas.outputs.has_cert == 'true'
        env:
          VERSION:             ${{ needs.version.outputs.version }}
          BUILD_NUMBER:        ${{ needs.version.outputs.build_number }}
          APPLE_TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}
          MAS_PROFILE_UUID:    ${{ steps.mas.outputs.profile_uuid }}
          MAS_INSTALLER_CERT:  ${{ steps.mas.outputs.installer }}
          APPLE_API_KEY_PATH:  ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          # Tag pushes upload; manual runs upload only when the input is true.
          DO_UPLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_app_store }}
        run: |
          MODE=(--validate-only)
          if [[ "$DO_UPLOAD" == "true" ]]; then
            MODE=(--upload)
          fi
          cd DiskFree && ./release.sh \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --out "../dist-mas" \
            --app-store "${MODE[@]}"
          if [[ "$DO_UPLOAD" == "true" ]]; then
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Distribute to TestFlight
        if: steps.upload.outputs.uploaded == 'true' && vars.TESTFLIGHT_GROUPS != ''
        env:
          VERSION:             ${{ needs.version.outputs.version }}
          BUILD_NUMBER:        ${{ needs.version.outputs.build_number }}
          TESTFLIGHT_GROUPS:   ${{ vars.TESTFLIGHT_GROUPS }}
          APPLE_API_KEY_PATH:  ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # What to Test: the annotated tag message, else commit subjects
          # since the newest other release/* tag.
          NOTES="$RUNNER_TEMP/whats-new.txt"
          : > "$NOTES"
          if [[ "$GITHUB_REF" == refs/tags/release/* ]]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$NOTES"
          fi
          if [[ -z "$(tr -d '[:space:]' < "$NOTES")" ]]; then
            PREV="$(git tag -l 'release/*' --sort=-v:refname | grep -vx "release/$VERSION" | head -1 || true)"
            if [[ -n "$PREV" ]]; then
              git log --format='- %s' "$PREV..HEAD" > "$NOTES"
            else
              git log --format='- %s' -20 > "$NOTES"
            fi
          fi
          python3 -m venv "$RUNNER_TEMP/tfvenv"
          "$RUNNER_TEMP/tfvenv/bin/pip" install --quiet "PyJWT[crypto]"
          "$RUNNER_TEMP/tfvenv/bin/python" DiskFree/scripts/testflight.py \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --whats-new-file "$NOTES" \
            --group "$TESTFLIGHT_GROUPS"

      - name: Clean up keychain, profile and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mas.keychain" || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/mas-certs.p12"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.mas.outputs.profile_uuid }}.provisionprofile"

      - uses: actions/upload-artifact@v4
        if: steps.mas.outputs.has_cert == 'true'
        with:
          name: disk-free-mas
          path: dist-mas/*_mas.pkg
          if-no-files-found: error

  # ── Publish draft GitHub Release ──────────────────────────────────────────────
  # Skipped on workflow_dispatch so you can test the build without creating a release.
  release-publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release/')
    needs: [version, build]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ needs.version.outputs.tag }}
          name:                   DiskFree ${{ needs.version.outputs.version }}
          draft:                  true
          generate_release_notes: true
          files:                  release-artifacts/**/*
