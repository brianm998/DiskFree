# SPDX-License-Identifier: MIT
# Solo fast: explore, develop, fast tests, land directly. For side projects and low risk.
schema = 1
start = "explore"
explored_entry = "develop"

[step.explore]
type = "agent"
category = "exploring"
agent = "light"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "deep"
budget = "4h"
next = "test"

[step.test]
type = "test"
category = "testing"
suites = ["swift"]
max_rounds = 3
on_red = "develop"
next = "land"

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"

[suite.swift]
command = "cd DiskFree && xcodebuild test -project DiskFree.xcodeproj -scheme DiskFree -destination 'platform=macOS' -skip-testing:DiskFreeUITests 2>&1"
parser = "xctest"
min_tests = 1
level = "unit"
